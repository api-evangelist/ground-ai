name: Ground AI
description: >-
  Ground — legally Cheres, Inc (dba Ground), 20 Exchange Place, New York — is an AI-native
  revenue platform for consumer and e-commerce brands, delivering autonomous "AI revenue
  agents" that work across the customer lifecycle. Its named agents are Greet AI for
  first-touch conversion of new visitors, ReCartify for identity resolution, ReBeat AI for
  repeat purchase and winback, and Terra for repetitive marketer tasks. Ground positions
  itself as Growth-as-a-Service, plugging into a brand's existing stack — Shopify, Adobe
  Commerce, WooCommerce, Klaviyo, Mailchimp, Attentive, Postscript, Yotpo, Meta Ads and
  Amped — with a stated 15-minute, no-developer setup. It is Techstars-backed and ships a
  free Shopify App Store listing. Ground publishes product documentation, a blog, an FAQ
  and a machine-readable llms.txt, and its robots.txt carries an explicit Cloudflare
  Content Signals AI-use reservation (search=yes, ai-train=no, use=reference). It publishes
  no public API, OpenAPI, MCP server, SDK, webhook catalog or developer portal: the platform
  is delivered as managed connectors into the tools a brand already runs, and every
  commercial path terminates in a demo booking.
