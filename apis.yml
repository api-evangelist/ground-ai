  - source: https://github.com/ground-ai/docs (api-reference/openapi.yaml)
    reason: >-
      Real, parsing OpenAPI 3.1.0, but it belongs to a DIFFERENT company. The spec says so
      about itself — info.title "Ground's API", servers[] https://platform.ground.dev,
      contact contact@ground.dev, and a description stating "The Ground API allows developers
      to create RAGs" with endpoints at www.ground.dev/api/. The sibling mint.json points at
      https://platform.bound.dev/api and https://grounddev.slack.com. That is ground.dev, a
      RAG/vector-search product, not Cheres, Inc (dba Ground) at joinground.com. NOT SAVED.
  - source: https://www.postman.com/joinground
    reason: >-
      HTTP 200 is Postman's single-page-app catch-all. The Postman search API returns 0
      results of every kind for "joinground". No public collection or workspace exists.
  - source: https://trust.joinground.com/
    reason: >-
      Wildcard *.joinground.com resolves to Vercel; the host answers 429 with a "Vercel
      Security Checkpoint" interstitial on every path. Not a trust center.
