name: Ground AI
description: >-
  Ground (joinground.com) is an AI-native revenue platform for consumer and e-commerce
  brands, delivering autonomous "AI revenue agents" that drive growth across the customer
  lifecycle. Its products include Greet AI for converting new visitors, ReBeat AI for
  repeat purchases and retention, and Terra, an AI-native revenue engine that orchestrates
  actions across the funnel. Ground positions itself as Growth-as-a-Service, plugging into a
  brand's existing stack (Shopify, Klaviyo, Mailchimp, Recharge, Salesforce, Meta, Google Ads
  and 20+ platforms) with a fast, low-lift deployment. Headquartered in New York and Silicon
  Valley with a global team, Ground is a Techstars-backed company. This profile was added to
  the API Evangelist network via VC-portfolio discovery; the company publishes no public API,
  developer portal, SDKs, or technical documentation at this time.
